<title>Tower of Wishes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
  /* One screen, the fight under a thin HUD: hero cards bottom left, commands bottom right. A single dark look by choice. */
  :root {
    --ground: #16261a;        /* the canvas edge, the night behind the clearing */
    --panel: rgba(13, 18, 14, 0.82);
    --line: #34463a;
    --text: #f0e7cf;          /* parchment */
    --muted: #a7a58f;
    --gold: #ffd36b;          /* the target, a ready art */
    --hurt: #d9534a;
    --display: "Pixelify Sans", "Trebuchet MS", sans-serif;
    --label: "Silkscreen", "Courier New", monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--display); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; }

  .top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; pointer-events: none; }
  .place { font: 700 15px/1 var(--display); letter-spacing: 0.04em; text-shadow: 0 1px 0 #000; }
  #hint { font: 10px/1.2 var(--label); color: var(--text); opacity: 0.85; letter-spacing: 0.06em; text-shadow: 0 1px 0 #000; text-align: right; }

  .bottom { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; pointer-events: none; }
  #heroes { display: flex; gap: 8px; pointer-events: auto; }
  .hero { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 6px 6px 6px 8px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--hero); border-radius: 4px; min-width: 0; }
  .hero.down { opacity: 0.45; }
  .face canvas { width: 28px; height: 28px; image-rendering: pixelated; display: block; }
  .info { min-width: 84px; display: grid; gap: 3px; }
  .name { font: 700 13px/1 var(--display); }
  .bar { height: 5px; background: #2a1a18; border-radius: 1px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--hero); transition: width 0.2s; }
  .hpnum { font: 8px/1 var(--label); color: var(--muted); font-variant-numeric: tabular-nums; }
  .art { position: relative; width: 40px; height: 40px; border: 0; padding: 0; background: none; color: var(--muted); font: 8px var(--label); cursor: pointer; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .art .track { fill: rgba(0, 0, 0, 0.35); stroke: var(--line); stroke-width: 3; }
  .art .fill { fill: none; stroke: var(--hero); stroke-width: 3; stroke-dasharray: 94.2; stroke-dashoffset: 94.2; }
  .art span { position: relative; }
  .art.ready { color: var(--ground); }
  .art.ready .track { fill: var(--gold); }
  .art.ready .fill { stroke: var(--gold); }
  .art.ready { animation: ready 0.9s ease-in-out infinite alternate; }
  @keyframes ready { to { transform: scale(1.08); } }
  .art:disabled { cursor: default; }

  .commands { display: flex; gap: 8px; pointer-events: auto; }
  .cmd { font: 10px/1 var(--label); letter-spacing: 0.05em; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; }
  .cmd[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .cmd:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #result { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 9, 7, 0.55); }
  .result-box { text-align: center; padding: 20px 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 10px; }
  #result-title { font: 700 24px/1.1 var(--display); text-wrap: balance; }
  #result-sub { font: 10px var(--label); color: var(--muted); }
  #retry { justify-self: center; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 11px var(--label); color: var(--muted); }
  #turn { display: none; }
  @media (orientation: portrait) {
    #turn { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--ground); font: 14px/1.5 var(--display); z-index: 5; }
  }
  @media (prefers-reduced-motion: reduce) { .art.ready { animation: none; } }
</style>

<canvas id="stage" aria-label="The fight in the clearing"></canvas>
<div class="top">
  <div class="place">The Clearing</div>
  <div id="hint">Tap a bandit to make it the target</div>
</div>
<div class="bottom">
  <div id="heroes"></div>
  <div class="commands">
    <button class="cmd" id="regroup" type="button">Regroup</button>
    <button class="cmd" id="auto" type="button" aria-pressed="false">Auto</button>
  </div>
</div>
<div id="result" hidden>
  <div class="result-box">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <button class="cmd" id="retry" type="button">Fight again</button>
  </div>
</div>
<div id="loading">Loading the clearing…</div>
<div id="turn">Turn your phone sideways to fight.</div>
<script type="module" src="src/main.js"></script>
