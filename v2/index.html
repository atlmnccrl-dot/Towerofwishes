<title>Vael Company</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
  /* Three screens: the team (roster + formation), the battle (canvas under a thin HUD), the result.
     One dark look by choice: a camp at night, parchment text, gold for what is chosen or ready. */
  :root {
    --ground: #121a14;
    --panel: rgba(16, 22, 17, 0.9);
    --panel-2: #1b261d;
    --line: #34463a;
    --text: #f0e7cf;
    --muted: #a7a58f;
    --gold: #ffd36b;
    --ally: #8cc8ff;
    --hurt: #d9534a;
    --hp: #6fcf6a;
    --vanguard: #8fb3d9; --striker: #e08a6a; --ranger: #9fd07a; --mystic: #b99cf0; --support: #f0d27a;
    --display: "Pixelify Sans", "Trebuchet MS", sans-serif;
    --label: "Silkscreen", "Courier New", monospace;
    --gut-l: max(16px, env(safe-area-inset-left, 0px));
    --gut-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--display); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .face { width: 32px; height: 32px; image-rendering: pixelated; background-image: url(assets/portraits.png); border-radius: 3px; background-color: #0c120d; flex: none; }
  .cls { font: 7px/1 var(--label); letter-spacing: 0.06em; color: var(--c, var(--muted)); text-transform: uppercase; }
  .btn { font: 10px/1 var(--label); letter-spacing: 0.05em; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; cursor: pointer; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--gold); color: #1c1408; border-color: var(--gold); font-size: 12px; padding: 12px 22px; }
  .btn.primary:disabled { background: var(--panel); color: var(--muted); border-color: var(--line); cursor: default; }

  /* ---- the team screen */
  #team { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(230px, 0.85fr) 1.4fr; grid-template-rows: auto 1fr auto; gap: 8px 14px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gut-r) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gut-l);
    background: radial-gradient(120% 90% at 20% 100%, #2a2414 0%, var(--ground) 60%); box-sizing: border-box; }
  .head { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .head h1 { margin: 0; font: 700 18px/1 var(--display); letter-spacing: 0.03em; }
  .head .sub { font: 8px/1.2 var(--label); color: var(--muted); letter-spacing: 0.06em; }
  .formation { display: grid; grid-template-rows: auto minmax(0, auto) auto; align-content: start; gap: 6px; min-height: 0; }
  .label { font: 8px/1 var(--label); color: var(--muted); letter-spacing: 0.08em; }
  #slots { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, minmax(0, 76px)); align-content: start; gap: 5px; min-height: 0; }
  .slot { position: relative; display: flex; align-items: center; gap: 6px; padding: 4px 6px; min-height: 0; background: rgba(0, 0, 0, 0.25); border: 1px dashed var(--line); border-radius: 4px; cursor: pointer; text-align: left; overflow: hidden; }
  .slot.filled { border-style: solid; background: var(--panel-2); border-left: 3px solid var(--c); }
  .slot.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .slot .empty { font: 8px var(--label); color: #5d6a5f; margin: auto; }
  .slot .nm { font: 700 12px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border: 0; background: none; color: var(--muted); font: 10px var(--label); cursor: pointer; }
  .rowlabels { display: grid; grid-template-columns: 1fr 1fr; text-align: center; }
  .right { display: grid; grid-template-rows: 1fr auto; gap: 6px; min-height: 0; }
  #roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 5px; overflow-y: auto; align-content: start; min-height: 0; padding-right: 2px; }
  .card { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; text-align: left; min-width: 0; }
  .card.in { border-color: var(--c); background: var(--panel-2); }
  .card.in .face { box-shadow: 0 0 0 1px var(--gold); }
  .card.focus { outline: 1px solid var(--gold); }
  .card .nm { font: 700 12px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card > div:not(.face) { min-width: 0; display: grid; gap: 3px; }
  #detail { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; display: grid; gap: 3px; min-height: 52px; }
  #detail .t { font: 700 13px/1.1 var(--display); }
  #detail .t small { font: 8px var(--label); color: var(--muted); margin-left: 6px; letter-spacing: 0.04em; }
  #detail .ab { font: 11px/1.3 var(--display); color: var(--text); }
  #detail .ab b { color: var(--gold); font-weight: 700; }
  #detail .ps { font: 10px/1.3 var(--display); color: var(--muted); }
  .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #waves { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .wave { font: 9px/1 var(--label); padding: 9px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; letter-spacing: 0.04em; }
  .wave[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .count { font: 9px var(--label); color: var(--muted); }

  /* ---- the battle */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 8px); left: var(--gut-l); right: var(--gut-r); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .wavename { font: 700 14px/1 var(--display); text-shadow: 0 1px 0 #000; }
  #clock { font: 9px var(--label); color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 6px; pointer-events: auto; }
  .tools .btn { padding: 8px 10px; }
  #allies { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); left: var(--gut-l); right: var(--gut-r); display: flex; gap: 6px; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 4px 7px 4px 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 0; flex: 0 1 150px; }
  .chip.down { opacity: 0.4; }
  .chip.ready { border-color: var(--gold); }
  .chip > div:not(.face) { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .chip .nm { font: 700 11px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; background: #2a1a18; border-radius: 1px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--hp); }
  .bar i.sh { background: #f4f1e6; opacity: 0.85; height: 2px; }
  .bar.en { height: 3px; background: #241f12; }
  .bar.en i { background: #c9a24a; }
  .chip.ready .bar.en i { background: var(--gold); }

  /* ---- the result */
  #result { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 9, 7, 0.6); padding: 12px var(--gut-r) 12px var(--gut-l); }
  .rbox { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; display: grid; gap: 10px; width: min(520px, 100%); box-sizing: border-box; max-height: 100%; overflow-y: auto; }
  #rtitle { font: 700 24px/1 var(--display); text-align: center; }
  #rtitle.win { color: var(--gold); }
  #rsub { font: 9px var(--label); color: var(--muted); text-align: center; letter-spacing: 0.05em; }
  #rrows { display: grid; gap: 5px; }
  .rrow { display: grid; grid-template-columns: 32px 92px 1fr; align-items: center; gap: 8px; }
  .rrow .face { width: 26px; height: 26px; }
  .rrow .nm { font: 700 11px/1.1 var(--display); }
  .rrow .mvp { font: 7px var(--label); color: #1c1408; background: var(--gold); padding: 2px 3px; border-radius: 2px; margin-left: 4px; vertical-align: 1px; }
  .rbars { display: grid; gap: 2px; }
  .rb { display: flex; align-items: center; gap: 5px; font: 7px var(--label); color: var(--muted); font-variant-numeric: tabular-nums; }
  .rb i { display: block; height: 4px; border-radius: 1px; background: var(--striker); }
  .rb.h i { background: var(--hp); }
  .ractions { display: flex; justify-content: center; gap: 8px; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 11px var(--label); color: var(--muted); background: var(--ground); }
  #turn { display: none; }
  @media (orientation: portrait) {
    #turn { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--ground); font: 14px/1.5 var(--display); z-index: 5; }
  }
  @media (max-height: 420px) {
    .head .sub { display: none; }
    #detail { min-height: 44px; padding: 5px 8px; }
    #detail .ab { font-size: 10px; }
    .card { padding: 3px 5px; }
  }
</style>

<canvas id="stage" aria-label="The battle" hidden></canvas>

<section id="team" aria-label="Team" hidden>
  <div class="head"><h1>Vael Company</h1><span class="sub">Battle lab: pick up to five, place them, fight</span></div>
  <div class="formation">
    <div class="rowlabels"><span class="label">Back row</span><span class="label">Front row</span></div>
    <div id="slots"></div>
    <div id="detail"></div>
  </div>
  <div class="right">
    <div id="roster"></div>
  </div>
  <div class="foot">
    <div id="waves"></div>
    <span class="count" id="count"></span>
    <button class="btn primary" id="fight" type="button">Fight</button>
  </div>
</section>

<div id="hud" hidden>
  <div class="top">
    <div><span class="wavename" id="wavename"></span><span id="clock"></span></div>
    <div class="tools">
      <button class="btn" id="speed" type="button" aria-label="Speed">1×</button>
      <button class="btn" id="leave" type="button">Retreat</button>
    </div>
  </div>
  <div id="allies"></div>
</div>

<div id="result" hidden>
  <div class="rbox">
    <div id="rtitle"></div>
    <div id="rsub"></div>
    <div id="rrows"></div>
    <div class="ractions">
      <button class="btn" id="again" type="button">Fight again</button>
      <button class="btn primary" id="toteam" type="button">Team</button>
    </div>
  </div>
</div>

<div id="loading">Loading…</div>
<div id="turn">Turn your phone sideways to play.</div>
<script type="module" src="src/main.js"></script>
