<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080c">
<title>Bellmourn</title>
<style>
    :root { --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right); }
  html, body { margin: 0; padding: 0; background: #06080c; overflow: hidden; height: 100%; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; }
  #ui { image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
  #game { touch-action: none; }
  #rotate { display: none; position: fixed; inset: 0; background: #06080c; color: #c8b890; font: 16px monospace; align-items: center; justify-content: center; text-align: center; z-index: 9; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="ui"></canvas>
<div id="rotate">Turn your phone sideways.<br><small>Bellmourn plays in landscape.</small></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
