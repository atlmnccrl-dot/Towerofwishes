<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120f10">
<title>Hollowlands</title>
<style>
  html, body { margin: 0; height: 100%; background: #120f10; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; left: 0; top: 0; transform-origin: 0 0; }
  canvas { position: absolute; left: 0; top: 0; display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: #ece4d1; font: 600 22px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 6px; background: #120f10; z-index: 5; }
  #loading small { font-size: 11px; letter-spacing: 3px; color: #8d8678; }
  #safe { position: absolute; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="game"></canvas></div>
<div id="loading">HOLLOWLANDS<small>waking the world&hellip;</small></div>
<div id="safe"></div>
<script src="js/util.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/world.js"></script>
<script src="vendor/three.min.js"></script>
<script src="js/render3d.js"></script>
<script src="js/save.js"></script>
<script src="js/actors.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
