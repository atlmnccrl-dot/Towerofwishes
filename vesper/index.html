<style>
  /* One dark look by choice: a red moon over ink. Display type is angular, body type is plain. */
  :root {
    --ink: #07060a; --panel: rgba(12, 8, 14, 0.78); --line: rgba(255, 255, 255, 0.12); --line-hi: rgba(255, 255, 255, 0.28);

    color-scheme: dark;
  }
  @font-face { font-family: 'Adventurer'; src: url('../assets/ui/adventurer.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); overflow: hidden; height: 100%; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; font-family: var(--f-body); }
  #game { display: block; position: fixed; left: 0; top: 0; }
  #ui canvas { display: block; position: static; }
  #ui { position: fixed; inset: 0; z-index: 5; padding: max(18px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); box-sizing: border-box; display: flex; }

  /* ---- Campaign map: a top bar and a details panel over the canvas map ---- */

  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), #ff8a9a); border-radius: 2px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .lvl-info small { font-size: 10px; color: var(--dim); letter-spacing: .08em; }
  /* Phones: the map bar on one row, small chips (the star count is on the map's act panel too). */
  @media (max-height: 480px) { .map-bar { gap: 5px; flex-wrap: nowrap; } .map-bar .chip { padding: 7px 8px; font-size: 10px; letter-spacing: .1em; gap: 5px; } .map-bar .lvl { padding: 3px 8px 3px 3px; gap: 6px; } .map-bar .lvl-num { width: 26px; height: 26px; font-size: 12px; } .map-bar .lvl-info { min-width: 70px; } .map-bar .lvl-info b { font-size: 9px; letter-spacing: .1em; } .map-bar .lvl-info small { display: none; } .map-bar .chip.stars { display: none; } }
  .chip { appearance: none; font: 600 12px var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: border-color .15s, background .15s, transform .15s; }
  .chip:hover, .chip:focus-visible { border-color: var(--red); background: rgba(40,8,16,.85); outline: none; transform: translateY(-1px); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hc, var(--red)); box-shadow: 0 0 8px var(--hc, var(--red)); }

  .chip.danger { border-color: var(--red); color: var(--red-soft); }
  .gear-wrap { margin: auto; width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; padding: 8px; }

  .gear-tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  @media (max-width: 760px), (max-height: 480px) { .gear-body { grid-template-columns: 1fr 1.3fr; } .gear-body .gear-col:first-child { display: none; } .gear-col { max-height: 62vh; } .gi-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

    background: linear-gradient(180deg, rgba(10,6,12,.92), rgba(8,4,10,.96)); border-left: 1px solid var(--line); padding: max(20px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) 22px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  .big-btn { appearance: none; border: 0; cursor: pointer; font: 700 18px var(--f-display); letter-spacing: .28em; text-transform: uppercase; color: #fff; background: linear-gradient(180deg, #ff3a54, #c8102e); border-radius: 6px; padding: 14px 18px; box-shadow: 0 8px 24px rgba(255,42,68,.28), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .12s, box-shadow .12s, filter .12s; }

  /* ---- Skill tree ---- */
  .tree-wrap { margin: auto; width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: clamp(8px, 2vh, 16px); min-height: 0; }

  .tree { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2vw, 22px); overflow-y: auto; min-height: 0; padding-bottom: 6px; }

  .sk::after { content: ""; position: absolute; left: 26px; bottom: -15px; width: 2px; height: 14px; background: var(--line); }
  .branch .sk:last-child::after { display: none; }
  .sk-ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-display); border: 2px solid rgba(255,255,255,.15); color: var(--dim); }
  .sk-name { font: 600 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
  .sk-desc { grid-column: 2 / 4; font-size: 12px; color: var(--dim); line-height: 1.35; }

  .sk.owned .sk-cost { color: var(--bc); }

  .sk.locked { opacity: .55; cursor: default; }
  .sk.core .sk-name::after { content: "ABILITY"; margin-left: 8px; font-size: 9px; letter-spacing: .2em; color: var(--red-soft); border: 1px solid rgba(255,138,154,.4); border-radius: 3px; padding: 1px 4px; vertical-align: 1px; }
  .sk.flash { animation: learned .6s ease-out; }
  @keyframes learned { 0% { box-shadow: 0 0 0 0 rgba(255,208,96,.9); } 100% { box-shadow: 0 0 0 18px rgba(255,208,96,0); } }

  /* ---- Heroes (with locks) ---- */
  .cards.roster { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .screen-roster .boon-wrap { width: min(1000px, 100%); overflow-y: auto; }

  /* ---- Results ---- */

  #rotate { display: none; position: fixed; inset: 0; background: var(--ink); color: var(--red); font: 600 18px var(--f-display); letter-spacing: .1em; align-items: center; justify-content: center; text-align: center; z-index: 9; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }

  /* ==== Game skin: pixel font, iron-and-blood pixel frames, plate buttons, pixel bars and icons ==== */

  .panel h2::after, .tree-head h2::after, .gear-head h2::after { margin-left: 0; }
