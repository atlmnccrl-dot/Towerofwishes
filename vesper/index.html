<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Vesper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
  /* One dark look by choice: a red moon over ink. Display type is angular, body type is plain. */
  :root {
    --ink: #07060a; --panel: rgba(12, 8, 14, 0.78); --line: rgba(255, 255, 255, 0.12); --line-hi: rgba(255, 255, 255, 0.28);
    --text: #f3eef0; --dim: #a99aa2; --red: #ff2a44; --red-soft: #ff8a9a; --gold: #ffd060;
    --f-display: "Chakra Petch", "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @font-face { font-family: 'Adventurer'; src: url('../assets/ui/adventurer.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); overflow: hidden; height: 100%; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; font-family: var(--f-body); }
  #game { display: block; position: fixed; left: 0; top: 0; }
  #ui canvas { display: block; position: static; }
  #ui { position: fixed; inset: 0; z-index: 5; padding: max(18px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); box-sizing: border-box; display: flex; }
  #ui[hidden] { display: none !important; }
  .screen { flex: 1; display: flex; opacity: 0; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease; min-height: 0; }
  .screen.in { opacity: 1; transform: none; }
  .screen.dim { background: rgba(4, 3, 6, 0.62); margin: calc(-1 * max(18px, env(safe-area-inset-top, 0px))) calc(-1 * max(22px, env(safe-area-inset-right, 0px))) calc(-1 * max(18px, env(safe-area-inset-bottom, 0px))) calc(-1 * max(22px, env(safe-area-inset-left, 0px))); padding: inherit; }
  h1, h2 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; }
  .eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .35em; color: var(--red); text-transform: uppercase; margin: 0 0 6px; }
  .note { color: var(--dim); font-size: 13px; margin: 14px 0 0; max-width: 46ch; }

  /* Title: a column down the left over the arena. */
  .screen-title { align-items: stretch; }
  .title-col { display: flex; flex-direction: column; justify-content: center; gap: clamp(14px, 4vh, 28px); padding-right: 32px; background: linear-gradient(90deg, rgba(5,3,7,.82), rgba(5,3,7,.45) 70%, rgba(5,3,7,0)); margin-left: calc(-1 * max(22px, env(safe-area-inset-left, 0px))); padding-left: max(22px, env(safe-area-inset-left, 0px)); min-width: 0; width: min(420px, 48vw); }
  .logo h1 { font-size: clamp(44px, 11vh, 92px); letter-spacing: .14em; color: var(--red); line-height: .9; text-shadow: 0 0 40px rgba(255, 42, 68, .35); }
  .logo p { margin: 8px 0 0 4px; font-family: var(--f-display); font-weight: 500; font-size: clamp(11px, 2.2vh, 14px); letter-spacing: .42em; text-transform: uppercase; color: var(--red-soft); }
  .menu { display: flex; flex-direction: column; gap: 2px; }
  .btn { appearance: none; border: 0; background: transparent; color: var(--dim); font: inherit; text-align: left; cursor: pointer; padding: clamp(5px, 1.2vh, 9px) 12px clamp(5px, 1.2vh, 9px) 16px; display: flex; flex-direction: column; gap: 1px; position: relative; border-radius: 2px; transition: color .15s, background .15s, transform .15s; outline: none; }
  .btn::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 0; background: var(--red); transform: translateY(-50%); transition: height .15s; }
  .btn-label { font-family: var(--f-display); font-weight: 600; font-size: clamp(15px, 3.2vh, 20px); letter-spacing: .14em; text-transform: uppercase; }
  .btn-sub { font-size: clamp(11px, 2vh, 13px); color: var(--dim); letter-spacing: .02em; opacity: .85; }
  .btn:hover, .btn:focus-visible, .btn:focus { color: var(--text); background: linear-gradient(90deg, rgba(255,42,68,.16), rgba(255,42,68,0)); transform: translateX(4px); }
  .btn:hover::before, .btn:focus::before { height: 70%; }
  .btn.danger .btn-sub { color: var(--red-soft); }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--dim); font-size: 12px; }
  .keys span { display: inline-flex; align-items: center; gap: 4px; }
  kbd { font-family: var(--f-display); font-size: 11px; font-weight: 600; color: var(--text); border: 1px solid var(--line-hi); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: rgba(255,255,255,.04); }

  /* Panels: settings, credits. */
  .panel { margin: auto; width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: clamp(16px, 4vh, 28px) clamp(18px, 4vw, 32px); box-sizing: border-box; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .panel h2 { font-size: clamp(22px, 5vh, 30px); letter-spacing: .12em; text-transform: uppercase; margin-bottom: clamp(8px, 2vh, 16px); color: var(--text); }
  .menu.rows .btn { flex-direction: row; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); border-radius: 0; }
  .menu.rows .btn-sub { font-family: var(--f-display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--red-soft); }
  .credits { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 14px; font-size: 13px; }
  .credits dt { font-family: var(--f-display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--red-soft); font-size: 11px; padding-top: 2px; }
  .credits dd { margin: 0; color: var(--dim); min-width: 0; }

  /* Boon pick. */
  .boon-wrap { margin: auto; width: min(860px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; max-height: 100%; }
  .boon-wrap h2 { font-size: clamp(24px, 6vh, 40px); letter-spacing: .16em; text-transform: uppercase; }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px clamp(14px, 3vw, 28px); margin: clamp(6px, 2vh, 14px) 0; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat b { font-family: var(--f-display); font-size: clamp(16px, 3.6vh, 22px); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
  .lead { color: var(--text); margin: 0 0 clamp(8px, 2vh, 14px); font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 2vw, 16px); width: 100%; }
  .btn.card { align-items: center; text-align: center; gap: 6px; padding: clamp(12px, 3vh, 22px) 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .btn.card::before { display: none; }
  .btn.card:hover, .btn.card:focus { transform: translateY(-4px); border-color: var(--red); background: rgba(40, 8, 16, .82); box-shadow: 0 10px 30px rgba(255, 42, 68, .18); }
  .card-moon { width: clamp(18px, 5vh, 28px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a9a, var(--red) 60%, #8a1022); box-shadow: 0 0 18px rgba(255, 42, 68, .55); margin-bottom: 4px; }
  .btn.card .btn-label { font-size: clamp(13px, 2.8vh, 16px); }
  .btn.card .btn-sub { font-size: clamp(11px, 2.2vh, 13px); color: var(--dim); }
  .carried { color: var(--dim); font-size: 12px; margin: clamp(8px, 2vh, 14px) 0 0; }
  .cards.heroes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .screen-heroes .boon-wrap { width: min(1120px, 100%); }
  .btn.card.hero { border-color: color-mix(in srgb, var(--hc) 40%, transparent); padding-top: 8px; }
  .btn.card.hero:hover, .btn.card.hero:focus { border-color: var(--hc); box-shadow: 0 10px 30px color-mix(in srgb, var(--hc) 25%, transparent); }
  .hero-fig { width: clamp(56px, 16vh, 96px); height: clamp(56px, 16vh, 96px); image-rendering: pixelated; }
  .btn.card.hero .btn-label { color: var(--hc); font-size: clamp(15px, 3.4vh, 20px); }
  .hero-title { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .hero-kit { font-size: 11px; color: var(--text); line-height: 1.5; margin-top: 4px; }
  .hero-kit b { font-family: var(--f-display); color: var(--hc); margin-right: 3px; }
  @media (max-height: 380px) { .btn.card.hero .btn-sub { display: none; } .hero-kit { font-size: 10px; } }

  /* Centered screens: defeat, pause, loading. */
  .center { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .center h2 { font-size: clamp(26px, 6vh, 38px); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 14px; }
  .center h2.big { font-size: clamp(38px, 10vh, 64px); color: var(--red); text-shadow: 0 0 40px rgba(255,42,68,.4); margin-bottom: 4px; }
  .quote { font-size: 16px; color: var(--red-soft); margin: 0; font-style: italic; }
  .menu.center { align-items: stretch; margin-top: 18px; min-width: 240px; }
  .menu.center .btn { align-items: center; text-align: center; }
  .menu.center .btn:hover, .menu.center .btn:focus { transform: none; }
  .loader { width: 160px; height: 2px; background: var(--line); margin-bottom: 14px; }
  .loader span { display: block; height: 100%; width: 0; background: var(--red); transition: width .2s; }
  @media (max-height: 380px) { .btn-sub { display: none; } .menu.rows .btn-sub { display: inline; } .btn.card .btn-sub { display: block; } .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { .screen, .btn { transition: none; } }

  /* ---- Campaign map: a top bar and a details panel over the canvas map ---- */
  #ui:has(> .screen-map) { pointer-events: none; }
  .screen-map { pointer-events: none; display: block; position: relative; }
  .screen-map > * { pointer-events: auto; }
  .map-bar { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: calc(100% - min(380px, 38vw) - 20px); }
  .lvl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px 6px 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .lvl-num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--f-display); color: var(--text); background: radial-gradient(circle, rgba(255,42,68,.35), rgba(255,42,68,.05)); border: 2px solid var(--red); }
  .lvl-info { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
  .lvl-info b { font: 600 11px var(--f-display); letter-spacing: .2em; text-transform: uppercase; }
  .xpbar { height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), #ff8a9a); border-radius: 2px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .lvl-info small { font-size: 10px; color: var(--dim); letter-spacing: .08em; }
  .chip { appearance: none; font: 600 12px var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: border-color .15s, background .15s, transform .15s; }
  .chip:hover, .chip:focus-visible { border-color: var(--red); background: rgba(40,8,16,.85); outline: none; transform: translateY(-1px); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hc, var(--red)); box-shadow: 0 0 8px var(--hc, var(--red)); }
  .chip.hot { border-color: var(--gold); color: var(--gold); animation: pulse 1.6s ease-in-out infinite; }
  .chip .badge { background: var(--gold); color: #1a1006; border-radius: 10px; padding: 1px 7px; font-size: 11px; letter-spacing: .04em; }
  .chip.icon { padding: 10px 12px; }
  .gold { color: var(--gold); font-family: var(--f-display); font-weight: 700; letter-spacing: .06em; }
  .gold.big { font-size: 18px; }
  .chip.on { border-color: var(--red); color: #fff; }
  .chip.off { opacity: .45; }
  .chip.danger { border-color: var(--red); color: var(--red-soft); }
  .gear-wrap { margin: auto; width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; padding: 8px; }
  .gear-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .gear-head h2 { margin: 0; }
  .gear-tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .gear-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1.1fr); gap: 10px; min-height: 0; flex: 1; }
  .gear-col { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; min-height: 0; max-height: 72vh; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .gi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .gi { appearance: none; display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; width: 100%; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08); border-left: 3px solid var(--rc, var(--line)); border-radius: 4px; padding: 5px; color: var(--text); font: inherit; cursor: pointer; margin-bottom: 6px; }
  .gi canvas { grid-row: span 2; width: 40px; height: 40px; image-rendering: pixelated; }
  .gi-name { font: 600 13px var(--f-body); color: var(--rc, var(--text)); line-height: 1.15; }
  .gi-sub { font-size: 11px; color: var(--dim); }
  .gi.sel, .gi:focus-visible, .gi:hover { border-color: var(--rc, var(--red)); background: rgba(40,8,16,.6); outline: none; }
  .gi.empty { cursor: default; grid-template-columns: 1fr; opacity: .6; }
  .gear-sum { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
  .gear-sum div { background: rgba(0,0,0,.3); border-radius: 4px; padding: 6px; display: flex; flex-direction: column; }
  .gear-sum b { font: 700 16px var(--f-display); color: var(--gold); }
  .gear-sum span { font-size: 10px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; }
  .gd canvas { width: 64px; height: 64px; float: left; margin: 0 10px 6px 0; }
  .gd h3 { margin: 0; font: 700 17px var(--f-display); color: var(--rc); letter-spacing: .04em; }
  .gd-sub { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
  .gd-lines { clear: both; list-style: none; margin: 8px 0; padding: 0; }
  .gd-lines li { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .gd-lines li:first-child { color: #fff; font-weight: 600; }
  .gd-cmp { font: 600 13px var(--f-display); margin: 4px 0 8px; } .gd-cmp.up { color: #9af0b8; } .gd-cmp.down { color: var(--red-soft); }
  .gd-acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .res-loot { margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
  .loot-it { display: flex; gap: 8px; align-items: center; border-left: 3px solid var(--rc); background: rgba(0,0,0,.3); padding: 5px 8px; border-radius: 4px; animation: lootIn .5s ease-out both; }
  .loot-it b { color: var(--rc); font-size: 14px; display: block; } .loot-it span { font-size: 12px; color: var(--dim); }
  .loot-it canvas { width: 40px; height: 40px; }
  @keyframes lootIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  @media (max-width: 760px), (max-height: 480px) { .gear-body { grid-template-columns: 1fr 1.3fr; } .gear-body .gear-col:first-child { display: none; } .gear-col { max-height: 62vh; } .gi-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }
  @keyframes pulse { 50% { box-shadow: 0 0 18px rgba(255,208,96,.35); } }
  .map-panel { position: absolute; right: calc(-1 * max(22px, env(safe-area-inset-right, 0px))); top: calc(-1 * max(18px, env(safe-area-inset-top, 0px))); bottom: calc(-1 * max(18px, env(safe-area-inset-bottom, 0px))); width: min(380px, 38vw); box-sizing: border-box;
    background: linear-gradient(180deg, rgba(10,6,12,.92), rgba(8,4,10,.96)); border-left: 1px solid var(--line); padding: max(20px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) 22px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .np-type { display: inline-flex; align-self: flex-start; font: 700 10px var(--f-display); letter-spacing: .24em; text-transform: uppercase; color: var(--tc); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); border-radius: 3px; padding: 3px 8px; }
  .map-panel h2 { font-size: clamp(20px, 4.4vh, 28px); letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; }
  .np-sub { margin: -6px 0 0; color: var(--dim); font-size: 13px; font-style: italic; }
  .np-rule { border: 1px solid rgba(201,160,255,.35); background: rgba(201,160,255,.08); color: #e4d4ff; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .np-h { font: 600 10px var(--f-display); letter-spacing: .26em; text-transform: uppercase; color: var(--dim); margin: 2px 0 -4px; }
  .np-foes { display: flex; flex-wrap: wrap; gap: 5px; }
  .np-foes span { font-size: 12px; color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
  .np-foes span.boss { color: var(--red-soft); border-color: rgba(255,42,68,.45); }
  .goals { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .goals li { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); }
  .goals li.on { color: var(--text); }
  .st { width: 15px; height: 15px; flex: none; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: rgba(255,255,255,.18); }
  .on .st, .st.on { background: var(--gold); }
  .np-reward { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--text); }
  .np-reward b { font-family: var(--f-display); color: var(--gold); letter-spacing: .06em; }
  .np-unlock { font-size: 12px; color: var(--hc, var(--gold)); border-left: 2px solid var(--hc, var(--gold)); padding-left: 8px; }
  .np-go { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .big-btn { appearance: none; border: 0; cursor: pointer; font: 700 18px var(--f-display); letter-spacing: .28em; text-transform: uppercase; color: #fff; background: linear-gradient(180deg, #ff3a54, #c8102e); border-radius: 6px; padding: 14px 18px; box-shadow: 0 8px 24px rgba(255,42,68,.28), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .12s, box-shadow .12s, filter .12s; }
  .big-btn:hover, .big-btn:focus-visible { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,42,68,.4), inset 0 1px 0 rgba(255,255,255,.25); outline: none; filter: brightness(1.08); }
  .big-btn.gold { background: linear-gradient(180deg, #ffd978, #d9a226); color: #241604; box-shadow: 0 8px 24px rgba(255,208,96,.25); }
  .big-btn[disabled] { background: rgba(255,255,255,.08); color: var(--dim); box-shadow: none; cursor: default; transform: none; filter: none; }
  .np-as { font-size: 12px; color: var(--dim); text-align: center; }
  .np-as button { appearance: none; background: none; border: 0; color: var(--hc, var(--text)); font: 600 12px var(--f-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 0 2px; }
  .np-empty { margin: auto 0; color: var(--dim); font-size: 14px; text-align: center; }

  /* ---- Skill tree ---- */
  .tree-wrap { margin: auto; width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: clamp(8px, 2vh, 16px); min-height: 0; }
  .tree-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .tree-head h2 { font-size: clamp(22px, 5vh, 34px); letter-spacing: .14em; text-transform: uppercase; }
  .tree-head .sp { font: 600 13px var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .tree-head .sp b { color: var(--gold); font-size: 18px; margin-right: 4px; }
  .tree-actions { display: flex; gap: 8px; }
  .tree { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2vw, 22px); overflow-y: auto; min-height: 0; padding-bottom: 6px; }
  .branch { display: flex; flex-direction: column; gap: 0; }
  .branch-h { padding: 0 0 10px; border-bottom: 2px solid var(--bc); margin-bottom: 10px; }
  .branch-h b { font: 700 16px var(--f-display); letter-spacing: .24em; text-transform: uppercase; color: var(--bc); }
  .branch-h span { display: block; font-size: 12px; color: var(--dim); }
  .sk { appearance: none; text-align: left; font: inherit; color: var(--text); position: relative; display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; margin-bottom: 14px; }
  .sk::after { content: ""; position: absolute; left: 26px; bottom: -15px; width: 2px; height: 14px; background: var(--line); }
  .branch .sk:last-child::after { display: none; }
  .sk-ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-display); border: 2px solid rgba(255,255,255,.15); color: var(--dim); }
  .sk-name { font: 600 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
  .sk-desc { grid-column: 2 / 4; font-size: 12px; color: var(--dim); line-height: 1.35; }
  .sk-cost { font: 600 11px var(--f-display); letter-spacing: .1em; color: var(--dim); white-space: nowrap; }
  .sk.owned { border-color: color-mix(in srgb, var(--bc) 60%, transparent); background: color-mix(in srgb, var(--bc) 10%, rgba(12,8,14,.85)); cursor: default; }
  .sk.owned .sk-ic { background: var(--bc); border-color: var(--bc); color: #12080e; }
  .sk.owned::after { background: var(--bc); }
  .sk.owned .sk-cost { color: var(--bc); }
  .sk.can { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(255,208,96,.25), 0 6px 20px rgba(255,208,96,.12); }
  .sk.can .sk-ic { border-color: var(--gold); color: var(--gold); }
  .sk.can .sk-cost { color: var(--gold); }
  .sk.can:hover, .sk.can:focus-visible { transform: translateY(-2px); background: rgba(40,28,8,.85); outline: none; }
  .sk.locked { opacity: .55; cursor: default; }
  .sk.core .sk-name::after { content: "ABILITY"; margin-left: 8px; font-size: 9px; letter-spacing: .2em; color: var(--red-soft); border: 1px solid rgba(255,138,154,.4); border-radius: 3px; padding: 1px 4px; vertical-align: 1px; }
  .sk.flash { animation: learned .6s ease-out; }
  @keyframes learned { 0% { box-shadow: 0 0 0 0 rgba(255,208,96,.9); } 100% { box-shadow: 0 0 0 18px rgba(255,208,96,0); } }

  /* ---- Heroes (with locks) ---- */
  .cards.roster { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .screen-roster .boon-wrap { width: min(1000px, 100%); overflow-y: auto; }
  .btn.card.hero.locked { filter: saturate(.2); opacity: .8; cursor: default; }
  .btn.card.hero.locked:hover, .btn.card.hero.locked:focus { transform: none; box-shadow: none; }
  .lockreq { font-size: 12px; color: var(--gold); }
  .lockbar { width: 70%; height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  .lockbar i { display: block; height: 100%; background: var(--gold); }
  .hero-cur { font: 600 10px var(--f-display); letter-spacing: .2em; color: var(--hc); text-transform: uppercase; }

  /* ---- Results ---- */
  .res { margin: auto; width: min(640px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(8px, 2vh, 14px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: clamp(16px, 4vh, 30px) clamp(16px, 4vw, 34px); box-sizing: border-box; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .res h2 { font-size: clamp(30px, 8vh, 52px); letter-spacing: .22em; text-transform: uppercase; }
  .res h2.win { color: var(--gold); text-shadow: 0 0 30px rgba(255,208,96,.35); }
  .res h2.lose { color: var(--red); text-shadow: 0 0 30px rgba(255,42,68,.4); }
  .res-stars { display: flex; gap: 14px; }
  .res-stars .st { width: clamp(30px, 8vh, 44px); height: clamp(30px, 8vh, 44px); }
  .res-stars .st.new { animation: starpop .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: none; } }
  .res .goals { align-self: stretch; }
  .res-xp { align-self: stretch; display: flex; flex-direction: column; gap: 6px; }
  .res-xp .row { display: flex; justify-content: space-between; font: 600 12px var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .res-xp .row b { color: var(--gold); }
  .res-xp .xpbar { height: 6px; }
  .lvlup { font: 700 16px var(--f-display); letter-spacing: .24em; color: var(--gold); text-transform: uppercase; animation: starpop .5s .4s both; }
  .unlock-card { align-self: stretch; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--hc); background: color-mix(in srgb, var(--hc) 10%, transparent); border-radius: 6px; padding: 8px 12px; }
  .unlock-card canvas { width: 64px; height: 64px; image-rendering: pixelated; }
  .unlock-card b { display: block; font: 700 15px var(--f-display); letter-spacing: .14em; color: var(--hc); text-transform: uppercase; }
  .unlock-card span { font-size: 12px; color: var(--dim); }
  .res .menu.center { margin-top: 4px; }
  .tip { font-size: 13px; color: var(--dim); max-width: 46ch; }
  #rotate { display: none; position: fixed; inset: 0; background: var(--ink); color: var(--red); font: 600 18px var(--f-display); letter-spacing: .1em; align-items: center; justify-content: center; text-align: center; z-index: 9; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
