<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Vesper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
  /* One dark look by choice: a red moon over ink. Display type is angular, body type is plain. */
  :root {
    --ink: #07060a; --panel: rgba(12, 8, 14, 0.78); --line: rgba(255, 255, 255, 0.12); --line-hi: rgba(255, 255, 255, 0.28);
    --text: #f3eef0; --dim: #a99aa2; --red: #ff2a44; --red-soft: #ff8a9a; --gold: #ffd060;
    --f-display: "Chakra Petch", "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @font-face { font-family: 'Adventurer'; src: url('../assets/ui/adventurer.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); overflow: hidden; height: 100%; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; font-family: var(--f-body); }
  canvas { display: block; position: fixed; left: 0; top: 0; }
  #ui { position: fixed; inset: 0; z-index: 5; padding: max(18px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); box-sizing: border-box; display: flex; }
  #ui[hidden] { display: none !important; }
  .screen { flex: 1; display: flex; opacity: 0; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease; min-height: 0; }
  .screen.in { opacity: 1; transform: none; }
  .screen.dim { background: rgba(4, 3, 6, 0.62); margin: calc(-1 * max(18px, env(safe-area-inset-top, 0px))) calc(-1 * max(22px, env(safe-area-inset-right, 0px))) calc(-1 * max(18px, env(safe-area-inset-bottom, 0px))) calc(-1 * max(22px, env(safe-area-inset-left, 0px))); padding: inherit; }
  h1, h2 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; }
  .eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .35em; color: var(--red); text-transform: uppercase; margin: 0 0 6px; }
  .note { color: var(--dim); font-size: 13px; margin: 14px 0 0; max-width: 46ch; }

  /* Title: a column down the left over the arena. */
  .screen-title { align-items: stretch; }
  .title-col { display: flex; flex-direction: column; justify-content: center; gap: clamp(14px, 4vh, 28px); padding-right: 32px; background: linear-gradient(90deg, rgba(5,3,7,.82), rgba(5,3,7,.45) 70%, rgba(5,3,7,0)); margin-left: calc(-1 * max(22px, env(safe-area-inset-left, 0px))); padding-left: max(22px, env(safe-area-inset-left, 0px)); min-width: 0; width: min(420px, 48vw); }
  .logo h1 { font-size: clamp(44px, 11vh, 92px); letter-spacing: .14em; color: var(--red); line-height: .9; text-shadow: 0 0 40px rgba(255, 42, 68, .35); }
  .logo p { margin: 8px 0 0 4px; font-family: var(--f-display); font-weight: 500; font-size: clamp(11px, 2.2vh, 14px); letter-spacing: .42em; text-transform: uppercase; color: var(--red-soft); }
  .menu { display: flex; flex-direction: column; gap: 2px; }
  .btn { appearance: none; border: 0; background: transparent; color: var(--dim); font: inherit; text-align: left; cursor: pointer; padding: clamp(5px, 1.2vh, 9px) 12px clamp(5px, 1.2vh, 9px) 16px; display: flex; flex-direction: column; gap: 1px; position: relative; border-radius: 2px; transition: color .15s, background .15s, transform .15s; outline: none; }
  .btn::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 0; background: var(--red); transform: translateY(-50%); transition: height .15s; }
  .btn-label { font-family: var(--f-display); font-weight: 600; font-size: clamp(15px, 3.2vh, 20px); letter-spacing: .14em; text-transform: uppercase; }
  .btn-sub { font-size: clamp(11px, 2vh, 13px); color: var(--dim); letter-spacing: .02em; opacity: .85; }
  .btn:hover, .btn:focus-visible, .btn:focus { color: var(--text); background: linear-gradient(90deg, rgba(255,42,68,.16), rgba(255,42,68,0)); transform: translateX(4px); }
  .btn:hover::before, .btn:focus::before { height: 70%; }
  .btn.danger .btn-sub { color: var(--red-soft); }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--dim); font-size: 12px; }
  .keys span { display: inline-flex; align-items: center; gap: 4px; }
  kbd { font-family: var(--f-display); font-size: 11px; font-weight: 600; color: var(--text); border: 1px solid var(--line-hi); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: rgba(255,255,255,.04); }

  /* Panels: settings, credits. */
  .panel { margin: auto; width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: clamp(16px, 4vh, 28px) clamp(18px, 4vw, 32px); box-sizing: border-box; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .panel h2 { font-size: clamp(22px, 5vh, 30px); letter-spacing: .12em; text-transform: uppercase; margin-bottom: clamp(8px, 2vh, 16px); color: var(--text); }
  .menu.rows .btn { flex-direction: row; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); border-radius: 0; }
  .menu.rows .btn-sub { font-family: var(--f-display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--red-soft); }
  .credits { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 14px; font-size: 13px; }
  .credits dt { font-family: var(--f-display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--red-soft); font-size: 11px; padding-top: 2px; }
  .credits dd { margin: 0; color: var(--dim); min-width: 0; }

  /* Boon pick. */
  .boon-wrap { margin: auto; width: min(860px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; max-height: 100%; }
  .boon-wrap h2 { font-size: clamp(24px, 6vh, 40px); letter-spacing: .16em; text-transform: uppercase; }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px clamp(14px, 3vw, 28px); margin: clamp(6px, 2vh, 14px) 0; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat b { font-family: var(--f-display); font-size: clamp(16px, 3.6vh, 22px); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
  .lead { color: var(--text); margin: 0 0 clamp(8px, 2vh, 14px); font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 2vw, 16px); width: 100%; }
  .btn.card { align-items: center; text-align: center; gap: 6px; padding: clamp(12px, 3vh, 22px) 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .btn.card::before { display: none; }
  .btn.card:hover, .btn.card:focus { transform: translateY(-4px); border-color: var(--red); background: rgba(40, 8, 16, .82); box-shadow: 0 10px 30px rgba(255, 42, 68, .18); }
  .card-moon { width: clamp(18px, 5vh, 28px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a9a, var(--red) 60%, #8a1022); box-shadow: 0 0 18px rgba(255, 42, 68, .55); margin-bottom: 4px; }
  .btn.card .btn-label { font-size: clamp(13px, 2.8vh, 16px); }
  .btn.card .btn-sub { font-size: clamp(11px, 2.2vh, 13px); color: var(--dim); }
  .carried { color: var(--dim); font-size: 12px; margin: clamp(8px, 2vh, 14px) 0 0; }
  .cards.heroes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .screen-heroes .boon-wrap { width: min(1120px, 100%); }
  .btn.card.hero { border-color: color-mix(in srgb, var(--hc) 40%, transparent); padding-top: 8px; }
  .btn.card.hero:hover, .btn.card.hero:focus { border-color: var(--hc); box-shadow: 0 10px 30px color-mix(in srgb, var(--hc) 25%, transparent); }
  .hero-fig { width: clamp(56px, 16vh, 96px); height: clamp(56px, 16vh, 96px); image-rendering: pixelated; }
  .btn.card.hero .btn-label { color: var(--hc); font-size: clamp(15px, 3.4vh, 20px); }
  .hero-title { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .hero-kit { font-size: 11px; color: var(--text); line-height: 1.5; margin-top: 4px; }
  .hero-kit b { font-family: var(--f-display); color: var(--hc); margin-right: 3px; }
  @media (max-height: 380px) { .btn.card.hero .btn-sub { display: none; } .hero-kit { font-size: 10px; } }

  /* Centered screens: defeat, pause, loading. */
  .center { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .center h2 { font-size: clamp(26px, 6vh, 38px); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 14px; }
  .center h2.big { font-size: clamp(38px, 10vh, 64px); color: var(--red); text-shadow: 0 0 40px rgba(255,42,68,.4); margin-bottom: 4px; }
  .quote { font-size: 16px; color: var(--red-soft); margin: 0; font-style: italic; }
  .menu.center { align-items: stretch; margin-top: 18px; min-width: 240px; }
  .menu.center .btn { align-items: center; text-align: center; }
  .menu.center .btn:hover, .menu.center .btn:focus { transform: none; }
  .loader { width: 160px; height: 2px; background: var(--line); margin-bottom: 14px; }
  .loader span { display: block; height: 100%; width: 0; background: var(--red); transition: width .2s; }
  @media (max-height: 380px) { .btn-sub { display: none; } .menu.rows .btn-sub { display: inline; } .btn.card .btn-sub { display: block; } .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { .screen, .btn { transition: none; } }
  #rotate { display: none; position: fixed; inset: 0; background: var(--ink); color: var(--red); font: 600 18px var(--f-display); letter-spacing: .1em; align-items: center; justify-content: center; text-align: center; z-index: 9; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui" hidden></div>
<div id="rotate">Turn your phone sideways.<br>Vesper plays in landscape.</div>
<script src="js/data.js"></script>
<script src="js/story.js"></script>
<script src="js/sim.js"></script>
<script src="js/assets.js"></script>
<script src="js/px.js"></script>
<script src="js/view.js"></script>
<script src="js/cine.js"></script>
<script src="js/tale.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
